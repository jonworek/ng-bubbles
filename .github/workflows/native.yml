name: Native Windows
on:
  push:
    branches: [main, codex/ng-bubbles-native, codex/startup-crash, codex/avatar-stability, codex/window-updates]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: dotnet test native/NgBubbles.Tests --configuration Release --logger "trx;LogFileName=native.trx"
      - run: dotnet publish native/NgBubbles.Windows --configuration Release -p:Platform=x64 -o dist/native
      - name: Launch native Windows UI
        shell: pwsh
        run: |
          $env:NG_BUBBLES_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'ng-smoke.json'
          $env:NG_BUBBLES_SMOKE_CONFIG = Join-Path $env:RUNNER_TEMP 'ng-smoke-fixture.json'
          $env:NG_BUBBLES_FIXTURES = Join-Path $pwd 'test/fixtures'
          $fixture = Start-Process node -ArgumentList @('test/native-ui-fixture.cjs', $env:NG_BUBBLES_SMOKE_CONFIG) -PassThru
          try {
            for ($i = 0; $i -lt 40 -and -not (Test-Path $env:NG_BUBBLES_SMOKE_CONFIG); $i++) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $env:NG_BUBBLES_SMOKE_CONFIG)) { throw 'Synthetic fixture did not start' }
            $process = Start-Process 'dist/native/NG Bubbles.exe' -ArgumentList '--smoke-test' -PassThru
            if (-not $process.WaitForExit(60000)) { Stop-Process $process.Id -Force; throw 'UI launch timed out' }
            if ($process.ExitCode -ne 0) { throw "UI exited with code $($process.ExitCode)" }
            if (-not (Test-Path $env:NG_BUBBLES_SMOKE_REPORT)) { throw 'UI acceptance report missing' }
            Get-Content $env:NG_BUBBLES_SMOKE_REPORT
          } finally { Stop-Process $fixture.Id -Force -ErrorAction SilentlyContinue }
      - name: Collect runtime licenses
        shell: pwsh
        run: ./scripts/collect-native-licenses.ps1 -OutputDirectory dist/native
      - name: Package Windows installer
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' installer/ng-bubbles.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Compress-Archive -Path 'dist/native/*' -DestinationPath 'dist/NG-Bubbles-0.4.9-x64-Portable.zip'
          Get-ChildItem dist -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - name: Verify installer and bundled runtimes
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/native/coreclr.dll')) { throw '.NET runtime was not bundled' }
          if (-not (Get-ChildItem dist/native -Recurse -Filter Microsoft.UI.Xaml.dll)) { throw 'WinUI runtime was not bundled' }
          if (Get-ChildItem dist/native -Recurse -Filter app.asar) { throw 'Unexpected Electron payload' }
          $install = Join-Path $env:RUNNER_TEMP 'ng-bubbles-installed'
          $installer = Start-Process 'dist/NG-Bubbles-0.4.9-x64-Setup.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install") -PassThru
          if (-not $installer.WaitForExit(60000)) { Stop-Process $installer.Id -Force; throw 'Installer timed out' }
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)" }
          $registration = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{93A36047-E2D8-4811-A103-2F769424ACF3}_is1'
          if ($registration.DisplayName -cne 'NG Bubbles') { throw "Unexpected installed-app name: $($registration.DisplayName)" }
          if ($registration.Publisher -cne 'Jon Worek Technology LLC') { throw "Unexpected publisher: $($registration.Publisher)" }
          if ($registration.DisplayVersion -cne '0.4.9') { throw "Unexpected installed-app version: $($registration.DisplayVersion)" }
          $installed = Join-Path $install 'NG Bubbles.exe'
          if (-not (Test-Path $installed)) { throw 'Installed executable missing' }
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash 'dist/native/NG Bubbles.exe').Hash) { throw 'Installed executable does not match the tested build' }
          if (-not (Test-Path (Join-Path $install 'licenses/packages.json'))) { throw 'Installed dependency notices missing' }
          ./scripts/test-installed-startup.ps1 -Executable $installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ng-bubbles-0.4.9-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            native/NgBubbles.Tests/TestResults/*.trx
            ${{ runner.temp }}/ng-smoke.json
            ${{ runner.temp }}/ng-smoke.png
            ${{ runner.temp }}/ng-smoke.json.error.txt
            ${{ runner.temp }}/ng-smoke.json.trace.txt
